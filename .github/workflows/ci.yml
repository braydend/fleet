name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --build-tags=smoke

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Ensure tmux is installed
        run: command -v tmux >/dev/null || (sudo apt-get update && sudo apt-get install -y tmux)
      - name: Assert integration test dependencies
        run: |
          for bin in git tmux; do
            if ! command -v "$bin" >/dev/null; then
              echo "::error::$bin is not on PATH — the integration tests would silently skip"
              exit 1
            fi
          done
          git --version
          tmux -V
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Smoke tests
        run: go test -race -tags smoke -run Smoke ./...
